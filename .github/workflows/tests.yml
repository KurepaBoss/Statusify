name: Tests

# Run the suite on every push and pull request, not only when a release is
# tagged, so a regression shows up on the commit that caused it.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # Windows: the app is Windows-only (named pipes, winreg, RegisterHotKey),
    # and the bridge tests need Node, which the runner image already has.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyflakes -r requirements.txt

      - name: Lint for undefined names
        shell: pwsh
        # pyflakes exits 1 on ANY finding (unused imports included), and pwsh
        # doesn't expand globs for native commands, so list the files
        # explicitly and fail only on undefined names.
        run: |
          $files = @("main.py") + (Get-ChildItem statusify_*.py).Name
          $out = python -m pyflakes @files | Select-String "undefined name"
          if ($out) { $out; exit 1 }
          exit 0

      - name: Run tests
        run: pytest -q
