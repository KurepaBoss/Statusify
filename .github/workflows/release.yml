name: Build Release Executable

# Tag a commit to cut a release:
#   git tag v1.2.0 && git push origin v1.2.0
#
# Also runnable by hand from the Actions tab, which builds the exe and leaves
# it as a workflow artifact without touching any release — useful for checking
# that a change still packages before committing to a tag.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write        # needed to upload assets onto the release

jobs:
  build:
    runs-on: windows-latest
    env:
      SIGNING_ENABLED: ${{ secrets.AZURE_CLIENT_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pytest -r requirements.txt

      # Build a broken exe and users find out by downloading it, so gate the
      # build on the suite rather than only on the version check.
      - name: Run tests
        run: pytest -q

      - name: Verify README and runtime versions match
        run: python scripts_check_version_sync.py

      - name: Build Statusify.exe
        run: pyinstaller --clean --noconfirm Statusify.spec

      # ── Code signing (Azure Trusted Signing) ─────────────────────
      # Dormant until the repository has the secrets listed in SIGNING.md;
      # without them the build is unsigned exactly as before. The exe is signed
      # BEFORE the installer is built so Setup.exe carries the signed copy, and
      # checksums are taken only after all signing is done.
      - name: Sign Statusify.exe
        if: env.SIGNING_ENABLED == 'true'
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # Setup.exe wraps the exe plus the Spicetify/bridge installer script.
      # Inno Setup isn't guaranteed on the runner image, so install it if absent.
      - name: Build installer
        shell: pwsh
        run: |
          $ver = (python -c "from version import VERSION; print(VERSION)").Trim()
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc "/DAppVersion=$ver" installer/Statusify.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force dist/setup | Out-Null
          Move-Item "dist/Statusify-Setup-$ver.exe" dist/setup/

      - name: Sign installer
        if: env.SIGNING_ENABLED == 'true'
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
          files-folder: ${{ github.workspace }}\dist\setup
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # Published checksums let users verify a download, and the in-app
      # updater refuses to run an installer whose hash doesn't match.
      - name: Generate SHA256 checksums
        shell: pwsh
        run: |
          Move-Item dist/setup/*.exe dist/
          foreach ($f in Get-ChildItem dist/Statusify*.exe) {
            $h = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($f.Name)" | Out-File -Encoding ascii -NoNewline "$($f.FullName).sha256"
            Write-Host "$($f.Name): $h"
          }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Statusify-exe
          path: |
            dist/Statusify.exe
            dist/Statusify.exe.sha256
            dist/Statusify-Setup-*.exe
            dist/Statusify-Setup-*.exe.sha256

      # Only on a tag push. gh is preinstalled on GitHub runners, so this needs
      # no third-party action in the release path.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF -replace '^refs/tags/', ''
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            # Release notes = the README's "What's New in <tag>" section. The
            # in-app update dialog shows this text as its changelog, so it
            # should read like release notes, not a commit list.
            $ver = [regex]::Escape($tag.TrimStart('v'))
            $md  = (Get-Content README.md -Raw -Encoding utf8) -replace "`r`n", "`n"
            if ($md -match "(?s)## [^\n]*What's New in v$ver\n(.*?)\n---") {
              $Matches[1].Trim() | Out-File -Encoding utf8 notes.md
              gh release create $tag --title "Statusify $tag" --notes-file notes.md
            } else {
              gh release create $tag --title "Statusify $tag" --generate-notes
            }
          }
          gh release upload $tag dist/Statusify.exe dist/Statusify.exe.sha256 (Get-ChildItem dist/Statusify-Setup-*).FullName --clobber
