<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
  <title>Statusify: synced lyrics on your Discord status (illustration)</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d10"/>
      <stop offset="1" stop-color="#12151a"/>
    </linearGradient>
  </defs>

  <rect width="900" height="400" rx="18" fill="url(#bg)"/>

  <!-- Left: a presence card, as friends see it -->
  <g transform="translate(40,56)">
    <rect width="400" height="288" rx="14" fill="#1a1f26" stroke="#252b34"/>
    <circle cx="44" cy="46" r="22" fill="#2b3340"/>
    <circle cx="60" cy="62" r="7" fill="#1db954" stroke="#1a1f26" stroke-width="3"/>
    <text x="80" y="42" fill="#f2f4f7" font-size="16" font-weight="700">you</text>
    <text x="80" y="62" fill="#a8b0bb" font-size="12">your profile, as friends see it</text>
    <line x1="24" y1="90" x2="376" y2="90" stroke="#252b34"/>
    <text x="24" y="116" fill="#a8b0bb" font-size="11" font-weight="700" letter-spacing="1">LISTENING TO STATUSIFY</text>
    <rect x="24" y="132" width="96" height="96" rx="10" fill="#b2341f"/>
    <circle cx="72" cy="180" r="29" fill="#ecaa5a"/>
    <text x="136" y="152" fill="#f2f4f7" font-size="15" font-weight="700">Song Title</text>
    <text x="136" y="174" fill="#d7dbe0" font-size="13">♪ the lyric line playing</text>
    <text x="136" y="192" fill="#d7dbe0" font-size="13">right now, on the beat</text>
    <text x="136" y="214" fill="#a8b0bb" font-size="12">Artist</text>
    <rect x="136" y="232" width="224" height="4" rx="2" fill="#252b34"/>
    <rect x="136" y="232" width="92" height="4" rx="2" fill="#f2f4f7"/>
    <text x="136" y="254" fill="#a8b0bb" font-size="11">1:12</text>
    <text x="360" y="254" text-anchor="end" fill="#a8b0bb" font-size="11">3:05</text>
  </g>

  <!-- Arrow -->
  <g transform="translate(456,200)" fill="none" stroke="#e3978c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M40 0 H0"/><path d="M12 -10 L0 0 L12 10"/>
  </g>

  <!-- Right: the Statusify window (1.5 lyric sheet, coloured from the cover) -->
  <g transform="translate(510,40)">
    <rect width="350" height="320" rx="14" fill="#1c110f" stroke="#382624"/>
    <text x="22" y="30" fill="#cfc5c4" font-size="12">Statusify</text>
    <rect x="22" y="48" width="46" height="46" rx="7" fill="#b2341f"/>
    <circle cx="45" cy="71" r="14" fill="#ecaa5a"/>
    <text x="80" y="66" fill="#f5f3f2" font-size="14" font-weight="700">Song Title</text>
    <text x="80" y="85" fill="#cfc5c4" font-size="12">Artist <tspan fill="#9c8581">· Spicy</tspan></text>
    <rect x="236" y="56" width="96" height="26" rx="4" fill="#4a2a24"/>
    <text x="284" y="74" text-anchor="middle" fill="#e3978c" font-size="11" font-weight="700">● On Discord</text>
    <text x="22" y="138" fill="#9c8581" font-size="12">the line before</text>
    <text x="22" y="170" fill="#f5f3f2" font-size="21" font-weight="700">the line playing now</text>
    <text x="22" y="198" fill="#cfc5c4" font-size="12">the line after</text>
    <rect x="22" y="236" width="306" height="3" rx="1.5" fill="#31201e"/>
    <rect x="22" y="236" width="104" height="3" rx="1.5" fill="#e3978c"/>
    <rect x="95" y="276" width="160" height="28" rx="4" fill="#251715"/>
    <rect x="99" y="280" width="52" height="20" rx="3" fill="#402c29"/>
    <text x="125" y="294" text-anchor="middle" fill="#f5f3f2" font-size="11" font-weight="700">Lyrics</text>
    <text x="177" y="294" text-anchor="middle" fill="#9c8581" font-size="11" font-weight="700">History</text>
    <text x="228" y="294" text-anchor="middle" fill="#9c8581" font-size="11" font-weight="700">Settings</text>
  </g>
</svg>
